<script type="module">
import init, * as bindings from './pdfcraft-web-48c25bfce92e5765.js';
const wasm = await init({ module_or_path: (async () => {
  const bytes = new Uint8Array(await (await fetch('./pdfcraft-web-5926c1a978a817b7_bg.wasm.gz')).arrayBuffer());
  // 0x1f 0x8b: still gzip, so decompress here. Otherwise the host already did (Content-Encoding).
  if (bytes[0] !== 0x1f || bytes[1] !== 0x8b) return bytes;
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
})() });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
